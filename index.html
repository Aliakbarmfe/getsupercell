<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت - لیست کاربران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0b0b; color: #fff; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">لیست ثبت نام کنندگان ایونت</h1>
      <button onclick="fetchUsers()" class="bg-white text-black px-4 py-2 rounded-lg font-bold hover:bg-gray-200">
        بروزرسانی لیست
      </button>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-zinc-800 text-gray-300 border-b border-zinc-700">
            <th class="p-4">#</th>
            <th class="p-4">نام کاربری</th>
            <th class="p-4">رمز عبور</th>
            <th class="p-4">تاریخ ثبت‌نام</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="4" class="p-4 text-center text-gray-500">در حال دریافت اطلاعات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchUsers() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">در حال بروزرسانی...</td></tr>';

      try {
        const res = await fetch('/api/getUsers');
        const users = await res.json();

        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">هیچ کاربری ثبت‌نام نکرده است.</td></tr>';
          return;
        }

        tbody.innerHTML = users.map((u, index) => `
          <tr class="border-b border-zinc-800 hover:bg-zinc-800/50">
            <td class="p-4 font-mono text-gray-400">${index + 1}</td>
            <td class="p-4 font-bold text-white dir-ltr text-right">${u.username}</td>
            <td class="p-4 font-mono text-yellow-400 dir-ltr text-right">${u.password}</td>
            <td class="p-4 text-sm text-gray-400">${new Date(u.createdAt).toLocaleString('fa-IR')}</td>
          </tr>
        `).join('');

      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">خطا در دریافت لیست!</td></tr>';
      }
    }

    // دریافت خودکار اطلاعات موقع باز شدن صفحه
    fetchUsers();
  </script>
</body>
</html>
